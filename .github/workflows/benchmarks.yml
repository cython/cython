name: Benchmarks

on:
  workflow_dispatch:
  push:
    paths:
      # Only run on changes likely to affect benchmark code generation
      - ".github/workflows/benchmarks.yml"
      - "Demos/benchmarks/**"
      - "Cython/Utility/**"
      - "Cython/Compiler/Nodes.py"
      - "Cython/Compiler/ExprNodes.py"
      - "Cython/Compiler/Optimize.py"
  pull_request:
    # Accepted labels (in the 'if' condition below) are:
    # * benchmark (explicit)
    # * performance (implicit)
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  file-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr-files: ${{ steps.filter.outputs.pr-files }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
      # Only needed to compare the "base" on push; not needed for PR
      if: ${{ github.event_name == 'push' }}
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
      id: filter
      with:
        base: ${{ case(github.event_name == 'push', github.ref, '') }}
        filters: |
          pr-files:
          # Only run on PRs likely to affect benchmark code generation
          - ".github/workflows/benchmarks.yml"
          - "Demos/benchmarks/**"
          - "Cython/Utility/**"
          - "Cython/Compiler/Nodes.py"
          - "Cython/Compiler/ExprNodes.py"
          - "Cython/Compiler/Optimize.py"

  benchmarks:
    runs-on: ubuntu-latest
    needs: [file-changes]

    if: |
      (github.event.action != 'labeled' && needs.file-changes.outputs.pr-files == 'true') ||
        github.event.label.name == 'benchmark' || github.event.label.name == 'performance'

    env:
      CCACHE_SLOPPINESS: "pch_defines,time_macros"
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 5
      CCACHE_NOHASHDIR: 1
      CFLAGS: -O3 -g1 -fPIC -mtune=generic
      BENCHMARK_CYTHONIZE_ARGS: -Xauto_pickle=False

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Compilation Cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          create-symlink: true
          variant: ${{ startsWith(runner.os, 'Windows') && 'sccache' || 'ccache' }}  # fake ternary
          save: ${{ startsWith(github.ref, '/refs/pull/') && 'false' || 'true' }}  # fake ternary
          key: ${{ runner.os }}-${{ runner.arch }}-hendrikmuhs-ccache-benchmarks
          max-size: 250M

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # List special Pythons first to keep the 'normal' one as (last) "python3.xy".
          python-version: |
            3.14t
            3.10
            3.12
            3.13
            3.14

      - name: Run Benchmarks
        run: |
          # Run benchmarks in all Python versions, Limited C-API only in 3.14.
          LIMITED_API=--with-limited
          for PYTHON in \
                python3.14 \
                python3.13 \
                python3.14t \
                python3.12 \
                python3.10 \
                ; do
              ${PYTHON} -m pip install setuptools numpy
              if [[ ${PYTHON} == *t || ${PYTHON} == *"t-dev" ]]; then
                COMMITS=("origin/3.1.x" "origin/master"  "HEAD")
                CYTHONIZE_ARGS="${BENCHMARK_CYTHONIZE_ARGS} -Xfreethreading_compatible=True"
              else
                COMMITS=("origin/3.0.x"  "3a7a936e099df468dcaa01829ae6567c577489c0"  "${LIMITED_API}" "origin/master"  "${LIMITED_API}" "HEAD")
                CYTHONIZE_ARGS="${BENCHMARK_CYTHONIZE_ARGS}"
              fi
              ${PYTHON} Demos/benchmarks/run_benchmarks.py  --report-size benchmark_sizes_${PYTHON}.csv --report benchmark_results_${PYTHON}.csv --with-python  ${CYTHONIZE_ARGS} ${COMMITS[*]}
              LIMITED_API=
          done | tee benchmarks.log

      - name: Create summary
        run: |
          { echo "## Benchmark results:";
            echo; python Demos/benchmarks/report.py -t timings benchmark_results_*.csv;
            echo; echo "## Benchmark module sizes:";
            echo; python Demos/benchmarks/report.py -t sizes benchmark_sizes_*.csv;
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload CSV results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark_*.csv
          path: benchmark_results_csv

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark_results.txt
          path: benchmarks.log
